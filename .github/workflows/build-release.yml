name: Signed Android Release
on:
  workflow_dispatch:
    inputs:
      format:
        description: Choose APK or Google Play AAB
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
      osm:
        description: First download fresh built-in OpenStreetMap maps (yes or no)
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare built-in OpenStreetMap maps
        if: ${{ inputs.osm == 'yes' }}
        continue-on-error: true
        run: |
          pip install --quiet osmium
          python3 tools/fetch_osm.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/osm
          git commit -m "Built-in OpenStreetMap maps updated" || echo "No changes"
          git push || echo "Push failed; the build still includes the maps"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android release signing is not configured. Complete Signing Key Management first."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
      - name: Build signed APK or AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REQUESTED_FORMAT: ${{ inputs.format }}
        run: |
          if [ "$REQUESTED_FORMAT" = 'aab' ]; then
            gradle --no-daemon :app:bundleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_FORMAT: ${{ inputs.format }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          mkdir -p release-files
          if [ "$REQUESTED_FORMAT" = 'aab' ]; then
            cp app/build/outputs/bundle/release/*.aab "release-files/Haluvi-Navigation-${VERSION}.aab"
          else
            cp app/build/outputs/apk/release/*.apk "release-files/Haluvi-Navigation-${VERSION}.apk"
          fi
          gh release create "$TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "Haluvi Navigation ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Signed ${REQUESTED_FORMAT} built from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
