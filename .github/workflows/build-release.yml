name: Signed Android Release
on:
  workflow_dispatch:
    inputs:
      format:
        description: Choose APK or Google Play AAB
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android release signing is not configured. Complete Signing Key Management first."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
      - name: Build signed APK or AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REQUESTED_FORMAT: ${{ inputs.format }}
        run: |
          if [ "$REQUESTED_FORMAT" = 'aab' ]; then
            gradle --no-daemon :app:bundleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi
      - name: Upload signed APK
        if: inputs.format == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload Google Play bundle
        if: inputs.format == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-play-bundle-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
